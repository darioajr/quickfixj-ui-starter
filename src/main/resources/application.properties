# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring Boot Configuration
spring.application.name=quickfixj-ui

# Logging Configuration
logging.level.com.example.quickfixj=DEBUG
logging.level.quickfix=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# QuickFix/J Monitoring Configuration
# Esta aplicação é apenas para MONITORAMENTO de sessões existentes
quickfixj-ui.monitoring.enabled=true
quickfixj-ui.monitoring.refresh-interval=5000
quickfixj-ui.monitoring.websocket-notifications=true

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*